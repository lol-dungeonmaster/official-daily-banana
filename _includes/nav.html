<script>
  function adjustNavHeight() {
    var nav = document.querySelector('.main-nav');
    var header = document.querySelector('header');
    if(nav && header && window.innerWidth > 768) {
      var headerBottom = header.getBoundingClientRect().bottom;
      if (headerBottom > 0) {
        nav.style.height = 'calc(100vh - ' + headerBottom + 'px)';
      } else {
        nav.style.height = '100vh';
      }
    } else if (nav) {
      nav.style.height = ''; // Reset on mobile
    }
  }
  window.addEventListener('scroll', adjustNavHeight, {passive: true});
  window.addEventListener('resize', adjustNavHeight, {passive: true});
  document.addEventListener('DOMContentLoaded', adjustNavHeight);
</script>
