name: Update Comment Counts

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch: # Allows manual trigger from UI

jobs:
  update-comments:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Fetch Comments from GraphQL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_comments.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/data/comments.json
          
          if ! git diff --staged --quiet; then
            LAST_COMMIT_MSG=$(git log -1 --pretty=%s)
            if [ "$LAST_COMMIT_MSG" = "chore: auto-update comment counts" ]; then
              git commit --amend --no-edit
              git push --force
            else
              git commit -m "chore: auto-update comment counts"
              git push
            fi
          fi
