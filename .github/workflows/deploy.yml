name: Deploy Jekyll site with Comments

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-comments:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    outputs:
      comments_changed: ${{ steps.commit_comments.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Comments & Create Missing Discussions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_comments.py

      - name: Commit Comment Counts
        id: commit_comments
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/data/comments.json

          if ! git diff --staged --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            LAST_COMMIT_MSG=$(git log -1 --pretty=%s)
            if [ "$LAST_COMMIT_MSG" = "chore: auto-update comment counts" ]; then
              git commit --amend --no-edit
              git push --force origin main
            else
              git commit -m "chore: auto-update comment counts"
              git push origin main
            fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: sync-comments
    if: github.event_name != 'schedule' || needs.sync-comments.outputs.comments_changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
